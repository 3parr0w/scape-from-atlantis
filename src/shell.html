<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d466f" />
    <title>فرار از آتلانتیس</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef3f6;
        --fg: #10283a;
        --card: #fff;
        --ac: #c2410c;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #071622;
          --fg: #e6eef4;
          --card: #0f2a3d;
        }
      }
      :root[data-theme="dark"] {
        --bg: #071622;
        --fg: #e6eef4;
        --card: #0f2a3d;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.6 Vazirmatn,
          Tahoma,
          sans-serif;
      }
      #app {
        height: 100%;
        max-width: 1100px;
        margin: auto;
        padding: 6px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #main {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #sc {
        flex: none;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
      }
      .chip {
        background: var(--card);
        border-radius: 999px;
        padding: 0 9px;
        font-size: 12px;
        border: 2px solid transparent;
        flex: none;
      }
      .chip.cur {
        border-color: var(--ac);
      }
      .dot {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        margin-inline-end: 5px;
      }
      #bw {
        flex: 1;
        min-height: 0;
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        background: #1b6196;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        direction: ltr;
      }
      #zc {
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #zc button {
        width: 40px;
        height: 40px;
        min-height: 0;
        padding: 0;
        border-radius: 50%;
        font-size: 20px;
        line-height: 1;
        background: #000a;
        border: 2px solid #fff6;
        color: #fff;
      }
      #side {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .box {
        background: var(--card);
        border-radius: 10px;
        padding: 8px 12px;
      }
      #bar {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #st {
        font-weight: 800;
      }
      #bt {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #bt:empty {
        display: none;
      }
      button {
        font: inherit;
        min-height: 44px;
        padding: 6px 16px;
        border-radius: 10px;
        border: 2px solid var(--ac);
        background: var(--ac);
        color: #fff;
        cursor: pointer;
        touch-action: manipulation;
      }
      button.g {
        background: transparent;
        color: var(--ac);
      }
      button:disabled {
        opacity: 0.4;
      }
      input {
        font: inherit;
        font-size: 16px;
        min-height: 44px;
        padding: 4px 10px;
        border-radius: 10px;
        border: 2px solid var(--ac);
        background: var(--card);
        color: var(--fg);
        max-width: 150px;
        box-sizing: border-box;
      }
      #lgd summary {
        cursor: pointer;
        font-size: 13px;
        opacity: 0.85;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #lg {
        font-size: 13px;
        opacity: 0.85;
        margin-top: 6px;
      }
      #ov {
        position: fixed;
        inset: 0;
        background: #000b;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9;
        padding: 12px;
        box-sizing: border-box;
      }
      #ov > div {
        background: var(--card);
        padding: 20px 22px;
        border-radius: 14px;
        text-align: center;
        max-width: 340px;
        max-height: 90%;
        overflow: auto;
      }
      #ov p {
        margin: 0.6em 0;
      }
      #ov .big {
        font-size: 56px;
        line-height: 1.2;
      }
      @media (orientation: landscape) and (max-height: 520px) {
        #app {
          flex-direction: row;
        }
        #side {
          width: 250px;
          overflow-y: auto;
        }
      }
      /* ---- board animation ---- */
      .tk .in { transform-box: fill-box; transform-origin: center; }
      .pop { animation: pop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); }
      @keyframes pop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); } }
      .cr { animation: bob 2.4s ease-in-out infinite; }
      .bt { animation: bob 3.2s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.8px); } }
      .selr { animation: selr 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes selr { 50% { transform: scale(1.18); } }
      .hl { animation: hl 1.3s ease-in-out infinite; }
      @keyframes hl { 50% { fill-opacity: 0.62; } }
      .twk { animation: twk 3.4s ease-in-out infinite; opacity: 0; }
      @keyframes twk { 50% { opacity: 0.9; } }
      .rip { fill: none; stroke: #fff; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: rip 0.9s ease-out forwards; }
      @keyframes rip { from { transform: scale(0.3); opacity: 0.85; } to { transform: scale(2.8); opacity: 0; } }
      .gh { animation: sink 0.9s ease-in forwards; }
      @keyframes sink { to { transform: translateY(9px) scale(0.4) rotate(25deg); opacity: 0; } }
      .bub { fill: none; stroke: #dff6ff; stroke-width: 1; animation: bub 1s ease-out forwards; }
      @keyframes bub { from { transform: translate(0, 0); opacity: 0.9; } to { transform: translate(var(--dx), -24px); opacity: 0; } }
      .spk { animation: spk 1s ease-out forwards; }
      @keyframes spk { from { transform: translate(0, 0) scale(1); opacity: 1; } to { transform: translate(var(--dx), -26px) scale(0.2); opacity: 0; } }
      .tileout { transform-box: fill-box; transform-origin: center; animation: tout 0.8s ease-in forwards; }
      @keyframes tout { 35% { transform: translateY(-9px) scale(1.06); } to { transform: translateY(-18px) scale(0.5); opacity: 0; } }
      .whirl { animation: wh 1.6s ease-in forwards; }
      @keyframes wh { from { transform: rotate(0) scale(1.3); opacity: 0.95; } to { transform: rotate(720deg) scale(0.15); opacity: 0; } }
      .blast { transform-box: fill-box; transform-origin: center; animation: blast 0.9s ease-out forwards; }
      @keyframes blast { from { transform: scale(0.2); opacity: 0.9; } to { transform: scale(3.2); opacity: 0; } }
      .emb { animation: emb 1.8s ease-out forwards; }
      @keyframes emb { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--dx), -80px); opacity: 0; } }
      #die { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 2; }
      .dice { width: 112px; height: 112px; border-radius: 22px; background: #fff; box-shadow: 0 8px 28px #0008; display: flex; align-items: center; justify-content: center; animation: roll 1.2s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
      @keyframes roll { 0% { transform: translateY(-140px) rotate(0) scale(0.5); opacity: 0; } 25% { opacity: 1; } 70% { transform: translateY(0) rotate(600deg) scale(1.12); } 100% { transform: rotate(720deg) scale(1); opacity: 1; } }
      .flash { position: absolute; inset: 0; background: radial-gradient(circle, #ffb03bcc, #ff3d0066 60%, transparent); animation: fl 1.4s ease-out forwards; }
      @keyframes fl { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cr, .bt, .twk, .hl, .selr { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="main">
        <div id="sc"></div>
        <div id="bw">
          <div id="die"></div>
        <svg id="bd" viewBox="0 0 750 580"></svg>
          <div id="zc">
            <button id="zi" aria-label="zoom in">＋</button
            ><button id="zo" aria-label="zoom out">－</button
            ><button id="zf" aria-label="fit">⤢</button>
          <button id="zm" aria-label="sound">🔊</button>
          </div>
        </div>
      </div>
      <div id="side">
        <div id="bar" class="box">
          <div id="st"></div>
          <div id="bt"></div>
        </div>
        <details id="lgd" class="box">
          <summary id="lgs">گزارش</summary>
          <div id="lg"></div>
        </details>
      </div>
    </div>
    <div id="ov"><div id="ovb"></div></div>
    <script>
      /*BUNDLE*/
    </script>
  </body>
</html>
