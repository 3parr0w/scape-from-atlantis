<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d466f" />
    <title>فرار از آتلانتیس</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef3f6;
        --fg: #10283a;
        --card: #fff;
        --ac: #c2410c;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #071622;
          --fg: #e6eef4;
          --card: #0f2a3d;
        }
      }
      :root[data-theme="dark"] {
        --bg: #071622;
        --fg: #e6eef4;
        --card: #0f2a3d;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.6 Vazirmatn,
          Tahoma,
          sans-serif;
      }
      #app {
        height: 100%;
        max-width: 1100px;
        margin: auto;
        padding: 6px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #main {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #sc {
        flex: none;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
      }
      .chip {
        background: var(--card);
        border-radius: 999px;
        padding: 0 9px;
        font-size: 12px;
        border: 2px solid transparent;
        flex: none;
      }
      .chip.cur {
        border-color: var(--ac);
      }
      .dot {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        margin-inline-end: 5px;
      }
      #bw {
        flex: 1;
        min-height: 0;
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        background: #1b6196;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        direction: ltr;
      }
      #zc {
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #zc button {
        width: 40px;
        height: 40px;
        min-height: 0;
        padding: 0;
        border-radius: 50%;
        font-size: 20px;
        line-height: 1;
        background: #000a;
        border: 2px solid #fff6;
        color: #fff;
      }
      #side {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .box {
        background: var(--card);
        border-radius: 10px;
        padding: 8px 12px;
      }
      #bar {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #st {
        font-weight: 800;
      }
      #bt {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #bt:empty {
        display: none;
      }
      button {
        font: inherit;
        min-height: 44px;
        padding: 6px 16px;
        border-radius: 10px;
        border: 2px solid var(--ac);
        background: var(--ac);
        color: #fff;
        cursor: pointer;
        touch-action: manipulation;
      }
      button.g {
        background: transparent;
        color: var(--ac);
      }
      button:disabled {
        opacity: 0.4;
      }
      input {
        font: inherit;
        font-size: 16px;
        min-height: 44px;
        padding: 4px 10px;
        border-radius: 10px;
        border: 2px solid var(--ac);
        background: var(--card);
        color: var(--fg);
        max-width: 150px;
        box-sizing: border-box;
      }
      #lgd summary {
        cursor: pointer;
        font-size: 13px;
        opacity: 0.85;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #lg {
        font-size: 13px;
        opacity: 0.85;
        margin-top: 6px;
      }
      #ov {
        position: fixed;
        inset: 0;
        background: #000b;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9;
        padding: 12px;
        box-sizing: border-box;
      }
      #ov > div {
        background: var(--card);
        padding: 20px 22px;
        border-radius: 14px;
        text-align: center;
        max-width: 340px;
        max-height: 90%;
        overflow: auto;
      }
      #ov p {
        margin: 0.6em 0;
      }
      #ov .big {
        font-size: 56px;
        line-height: 1.2;
      }
      @media (orientation: landscape) and (max-height: 520px) {
        #app {
          flex-direction: row;
        }
        #side {
          width: 250px;
          overflow-y: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="main">
        <div id="sc"></div>
        <div id="bw">
          <svg id="bd" viewBox="0 0 750 580"></svg>
          <div id="zc">
            <button id="zi" aria-label="zoom in">＋</button
            ><button id="zo" aria-label="zoom out">－</button
            ><button id="zf" aria-label="fit">⤢</button>
          </div>
        </div>
      </div>
      <div id="side">
        <div id="bar" class="box">
          <div id="st"></div>
          <div id="bt"></div>
        </div>
        <details id="lgd" class="box">
          <summary id="lgs">گزارش</summary>
          <div id="lg"></div>
        </details>
      </div>
    </div>
    <div id="ov"><div id="ovb"></div></div>
    <script>
      /*BUNDLE*/
    </script>
  </body>
</html>
